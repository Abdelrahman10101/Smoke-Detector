services:
  smoking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VARIANT: cpu
    container_name: petrochoice-smoking-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REQUIRE_GPU=0
      - ORT_THREADS=4
      - PROCESS_FPS=5.0
      - MAX_SESSIONS=2
      - SMOKING_THRESHOLD=0.50
      - CROP_MODE=person
      - VOTE_K=3
      - VOTE_N=5
      - COOLDOWN_S=60.0
      - MOTION_GATE=1
      - CCTV_SIM=0
      - VIDEOS_DIR=/data/videos
      - UPLOADS_DIR=/data/uploads
      - EVENTS_DIR=/data/events
    volumes:
      - ./data:/data
      - ./models:/app/models:ro
    read_only: false
    tmpfs:
      - /tmp
